<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="64" height="64" role="img" aria-labelledby="t">
  <title id="t">TollWire</title>
  <style>
    .m { fill: #2456e6; }
    @media (prefers-color-scheme: dark) { .m { fill: #8cb2ff; } }
  </style>
  <!-- wire: a line that arrives at the gate -->
  <rect class="m" x="2" y="14.7" width="10.4" height="2.6" rx="1.3"/>
  <!-- toll gate: a narrow barrier -->
  <rect class="m" x="14.2" y="5" width="3.6" height="22" rx="1.8"/>
  <!-- the path beyond the gate stays dotted: it does not continue -->
  <circle class="m" cx="22.2" cy="16" r="1.35" opacity=".5"/>
  <circle class="m" cx="26" cy="16" r="1.35" opacity=".34"/>
  <circle class="m" cx="29.8" cy="16" r="1.35" opacity=".2"/>
</svg>
